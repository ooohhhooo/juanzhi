<style>
.b-head{text-align:center;margin-bottom:18px}
.b-tag{font-size:24px;color:var(--accent);letter-spacing:6px}
.b-title{font-size:56px;color:#3A3226;margin-top:2px;line-height:1.15}
.b-sub{font-size:24px;color:#8A7F6E;margin-top:4px}
.b-sec{display:flex;gap:20px;margin-bottom:20px}
.b-no{flex:none;font-family:var(--font-serif);font-size:46px;font-weight:700;color:var(--accent2);width:68px;line-height:1.1}
.b-h{font-size:34px;color:var(--accent);margin-bottom:4px}
.b-p{font-size:28px;line-height:1.6;color:#4A4458}
.b-sign{text-align:right;font-size:26px;color:#8A7F6E;margin-top:8px}
</style>
<zone name="content"><div class="b-head"><div class="wk b-tag">学习简报</div><div class="wk b-title">{{#if title}}{{title}}{{else}}{{#if student}}{{student}}{{else}}孩子{{/if}}的学习简报{{/if}}</div>{{#if sub}}<div class="b-sub">{{sub}}</div>{{/if}}</div>
{{#each sections}}<div class="b-sec"><div class="b-no">{{@nn}}</div><div><div class="wk b-h">{{heading}}</div><div class="b-p">{{body}}</div></div></div>{{/each}}
{{#if foot}}<div class="wk b-sign">—— {{foot}}</div>{{/if}}</zone>
