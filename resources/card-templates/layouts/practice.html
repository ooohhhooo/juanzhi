<style>
.p-head{text-align:center;margin-bottom:14px}
.p-title{font-size:58px;color:#2B2A3D;line-height:1.1;margin-top:6px}
.p-q{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.p-n{flex:none;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--accent-soft)}
.p-t{font-size:34px;font-weight:700;line-height:1.3}
.p-o{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:26px;color:#8A86A0;margin-top:3px}
.p-enc{text-align:center;margin-top:8px}
.p-enc span{display:inline-block;border-radius:999px;background:var(--hl);color:#4A3A10;font-size:28px;font-weight:800;padding:5px 22px}
</style>
<zone name="content"><div class="p-head"><span class="chip">{{#if tag}}{{tag}}{{else}}小挑战{{/if}}</span><div class="sm p-title">{{title}}</div></div>
{{#each questions}}<div class="p-q"><span class="p-n">{{@n}}</span><div><div class="p-t en">{{q}}</div><div class="p-o en">{{#each options}}<span>{{this}}</span>{{/each}}</div></div></div>{{/each}}
{{#if encourage}}<div class="p-enc"><span>{{encourage}}</span></div>{{/if}}
{{#if foot}}<div class="foot">{{foot}}</div>{{/if}}</zone>
