<style>
.l-hi{font-size:44px;color:#5A3A26;margin-bottom:8px}
.l-sub{font-size:22px;color:#8A7F6E;margin-bottom:10px}
.l-p{font-size:30px;line-height:1.8;color:#4A3A30}
.l-bars{margin:14px 0;display:grid;gap:12px}
.l-bar .n{display:flex;justify-content:space-between;font-size:24px;color:#6A5A4A}
.l-bar .n b{color:var(--accent)}
.l-track{height:16px;border-radius:8px;background:#0000000f;margin-top:6px;position:relative}
.l-track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.l-track .f{background:#00000026}.l-track .t{background:var(--accent);opacity:.8}
.l-sign{text-align:right;font-size:30px;color:#7A5A44;margin-top:12px;line-height:1.4}
</style>
<zone name="content"><div class="wk l-hi">{{#if student}}{{student}}家长，您好：{{else}}家长您好：{{/if}}</div>{{#if sub}}<div class="l-sub">{{sub}}</div>{{/if}}
<div class="wk l-p">{{summary}}</div>
<div class="l-bars">{{#each items}}<div class="l-bar"><div class="n"><span>{{name}}</span><b>{{from}} → {{to}}</b></div><div class="l-track"><i class="f" style="width:{{fromPct}}%"></i><i class="t" style="width:{{toPct}}%"></i></div></div>{{/each}}</div>
{{#if next}}<div class="wk l-p">{{next}}</div>{{/if}}
{{#if foot}}<div class="wk l-sign">{{foot}}</div>{{/if}}</zone>
