# 构建 + 单测 + 打包 + 打包版冒烟（Windows / macOS）。
#
# ⚠️ 这个 workflow **从来没有真正运行过**：它是在没有 Windows 机器、也没有推送 GitHub 的情况下写的（M5 交付说明 §6）。
#    第一次推送后请先看一遍运行结果，预期里最可能需要调整的是：Windows 上 Electron 的启动方式、OCR 语言包、字体检查。
#    Mac 上的同一份冒烟脚本（tests/e2e/smoke-packaged.cjs）在本机跑通过，Windows 分支没有。
#
# 冒烟脚本在 Windows 上会：启动打包版 → 导入文本型 PDF（走文字层）/ 图片（走 Windows OCR；runner 没有中文语言包时验证「降级提示」而不是假装通过）/ docx
# → mock AI 解析 → 看板有数据 → 导出 PDF 报告并检查中文字体 → 导出数据包 → 截图。失败时截图和结果 JSON 作为 artifact 上传。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      install_zh_ocr:
        description: 'Windows：先在 runner 上安装中文 OCR 语言包（验证「有中文 OCR」那一支；默认不装，验证降级提示）'
        type: boolean
        default: false

# 只读令牌就够了（不用任何 secret，不往仓库写东西）
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            dist: dist:win
          - os: macos-latest
            name: macos
            dist: dist:mac
    env:
      # 不依赖任何签名证书：Mac 走 ad-hoc 签名，Windows 不签名
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      EWB_SMOKE_OUT: ${{ github.workspace }}/smoke-artifacts
      EWB_SMOKE_PREFIX: 'ci-'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # Electron 45 内置 Node 24；单测用 node:sqlite 和 --experimental-strip-types
          cache: npm

      - name: 缓存 Electron / electron-builder 下载
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # Windows 上的单测从未跑过（有的按 POSIX 路径写：符号链接、/etc、大小写折叠）：失败了也不能挡住后面的打包和冒烟——
      # 那才是在 Windows 上第一次最想看到的信息。所以 Windows 作业里这一步 continue-on-error，日志照样上传。macOS 作业里仍然是硬失败。
      - name: 单元测试
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          npm run test:unit 2>&1 | tee smoke-artifacts/unit-tests.log

      - name: 构建并打包
        run: npm run ${{ matrix.dist }}

      - name: 列出产物
        shell: bash
        run: ls -la release release/* | head -60

      # ── Windows 专属：OCR 现场信息（诊断用，不让它挡住后面的冒烟）──
      - name: Windows｜安装中文 OCR 语言包（仅手动触发且勾选时）
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.install_zh_ocr
        continue-on-error: true
        shell: pwsh
        run: |
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR~~~zh-CN~*' | Add-WindowsCapability -Online
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' | Format-Table Name, State -AutoSize

      - name: Windows｜OCR 脚本现场检查（打包后的 resources/native/windows/ocr.ps1）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-artifacts | Out-Null
          Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' | Format-Table Name, State -AutoSize | Out-String | Tee-Object smoke-artifacts/ocr-capabilities.txt
          $ps1 = "release/win-unpacked/resources/native/windows/ocr.ps1"
          if (-not (Test-Path $ps1)) { throw "找不到 $ps1" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -Check 2>&1 | Tee-Object smoke-artifacts/ocr-check.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 samples/g4-2025-page1.png 2>&1 | Tee-Object smoke-artifacts/ocr-sample.json | Select-Object -First 3

      # 区分「脚本的问题」和「环境的问题」：对照图（现场画的白底黑字）能识别而样张不能 → 脚本 / 样张；对照图都识别不出 → 环境。SCRIPT 结论会让这一步失败
      - name: Windows｜OCR 诊断：对照图 / 样张 / 拍平的样张
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/e2e/ocr-diagnose.ps1 -OcrScript release/win-unpacked/resources/native/windows/ocr.ps1 -Sample samples/g4-2025-page1.png -OutDir smoke-artifacts

      # ── 安装命令行工具会改用户 PATH：先放一个带 %USERPROFILE% 的 REG_EXPAND_SZ 值，冒烟里装完之后核对它的类型和原值一字不变、只多一个目录 ──
      - name: Windows｜准备用户 PATH（REG_EXPAND_SZ，带 %USERPROFILE%）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $orig = [string]$k.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $mine = if ($orig) { $orig.TrimEnd(';') + ';%USERPROFILE%\ewb-path-test' } else { '%USERPROFILE%\ewb-path-test' }
          $k.SetValue('Path', $mine, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $k.Close()
          Set-Content -Path $env:RUNNER_TEMP\path-before.txt -Value $mine -NoNewline

      - name: 打包版冒烟 E2E
        run: node tests/e2e/smoke-packaged.cjs

      # ── 命令行（M7）：smoke-packaged.cjs 里已经用 Node 跑过一遍（导入 / 报告 / 导出）并装好了短命令 juanzhi；
      #    这里用 runner 自带的原生 shell 再验证一次「GUI 子系统程序能不能拿到输出和退出码」——这是 Windows 上最容易出问题的地方。
      - name: Windows｜核对用户 PATH：类型和原值不变，只多一个目录，原值有备份
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $now = [string]$k.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $kind = $k.GetValueKind('Path'); $k.Close()
          $before = Get-Content -Raw $env:RUNNER_TEMP\path-before.txt
          Write-Host "kind=$kind"; Write-Host "before=$before"; Write-Host "now=$now"
          if ($kind -ne 'ExpandString') { throw "Path 的类型被改成了 $kind（应该保持 ExpandString）" }
          if (-not $now.StartsWith($before)) { throw 'PATH 原来的内容被改动了（%USERPROFILE% 之类被展开，或顺序变了）' }
          $extra = $now.Substring($before.Length).TrimStart(';')
          if ($extra -ne (Join-Path $env:LOCALAPPDATA 'Juanzhi\bin')) { throw "多出来的不是 juanzhi 目录：$extra" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Juanzhi\path-backup.txt'))) { throw '没有 PATH 备份文件' }

      - name: Windows｜命令行：PowerShell 里拿 stdout 和退出码
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path $env:LOCALAPPDATA 'Juanzhi\bin\juanzhi.cmd'
          if (-not (Test-Path $shim)) { throw "没有安装短命令：$shim（冒烟里的「安装命令行工具」没成功）" }
          # 1) juanzhi.cmd：同步等待，stdout 是 JSON，$LASTEXITCODE 是退出码
          $out = & $shim status
          $code = $LASTEXITCODE
          Write-Host "juanzhi status -> exit $code"; Write-Host $out
          if ($code -ne 0) { throw "juanzhi status 退出码 $code" }
          $j = ($out | Out-String).Trim() | ConvertFrom-Json
          if (-not $j.ok) { throw 'ok 不是 true' }
          if ($j.data.version -ne (Get-Content package.json | ConvertFrom-Json).version) { throw '版本号不对' }
          $null = & $shim bogus
          if ($LASTEXITCODE -ne 2) { throw "失败的命令退出码应是 2，实际 $LASTEXITCODE" }
          # 2) 直接调用 exe：Start-Process -Wait -PassThru + --result-file
          $exe = (Resolve-Path 'release/win-unpacked/EnglishExamWorkbench.exe').Path
          $rf = Join-Path $env:RUNNER_TEMP 'direct-result.json'
          $p = Start-Process -FilePath $exe -ArgumentList 'cli','status','--result-file',$rf -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "直接调用 exe 退出码 $($p.ExitCode)" }
          if (-not (Get-Content $rf -Raw | ConvertFrom-Json).ok) { throw '结果文件里 ok 不是 true' }
          # 3) 直接调用 exe 再接管道：只记录（软检查）
          $piped = & $exe cli status | Out-String
          Write-Host "直接调用 + 管道 stdout: [$($piped.Trim())]"
          New-Item -ItemType Directory -Force smoke-artifacts | Out-Null
          "pwsh: shim exit=$code; direct exit=$($p.ExitCode); piped='$($piped.Trim())'" | Out-File smoke-artifacts/cli-windows-pwsh.txt

      - name: Windows｜命令行：cmd 里拿 stdout 和退出码
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%LOCALAPPDATA%\Juanzhi\bin\juanzhi.cmd" status > cli-status.json
          if errorlevel 1 exit /b 1
          type cli-status.json
          findstr /C:"\"ok\":true" cli-status.json || exit /b 1
          call "%LOCALAPPDATA%\Juanzhi\bin\juanzhi.cmd" bogus > cli-bogus.json
          if errorlevel 3 exit /b 3
          if not errorlevel 2 exit /b 4
          type cli-bogus.json
          findstr /C:"\"ok\":false" cli-bogus.json || exit /b 5
          echo cmd 检查通过 > smoke-artifacts\cli-windows-cmd.txt

      - name: macOS｜命令行：短命令 juanzhi
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          juanzhi status | tee cli-status.json
          python3 -c "import json; j=json.load(open('cli-status.json')); assert j['ok'] and j['data']['version']"
          set +e; juanzhi bogus > cli-bogus.json; code=$?; set -e
          test "$code" = "2" || { echo "失败的命令退出码应是 2，实际 $code"; exit 1; }
          mkdir -p smoke-artifacts && cp cli-status.json smoke-artifacts/cli-macos-status.json

      - name: 上传冒烟截图 / 结果（失败时也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke-artifacts/
          if-no-files-found: warn

      - name: 上传安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
